<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citrux AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
            50% { box-shadow: 0 0 25px rgba(147, 51, 234, 0.6); }
        }
        .glow-effect {
            animation: pulseGlow 3s infinite ease-in-out;
        }
        .text-glow {
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }
        .ai-content ul {
            list-style-type: disc;
            margin-left: 1.2rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .ai-content ol {
            list-style-type: decimal;
            margin-left: 1.2rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .ai-content li {
            margin-bottom: 0.3rem;
        }
        .ai-content p {
            margin-bottom: 0.5rem;
        }
        @keyframes blink {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }
        .saving span {
            animation-name: blink;
            animation-duration: 1.4s;
            animation-iteration-count: infinite;
            animation-fill-mode: both;
        }
        .saving span:nth-child(2) { animation-delay: .2s; }
        .saving span:nth-child(3) { animation-delay: .4s; }
    </style>
</head>
<body class="bg-[#1e1e1e] text-gray-100 h-screen flex flex-col justify-between m-0 font-sans">

    <!-- Header / Top Bar -->
    <div class="py-3 px-6 bg-[#252525] border-b border-neutral-800 flex items-center justify-between shadow-md">
        <h2 class="text-lg font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 text-glow">🍋 CITRUX AI</h2>
    </div>

    <!-- Chat Messages Container -->
    <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-6 max-w-3xl mx-auto w-full">
        <div class="text-center my-auto space-y-3" id="welcomeText">
            <h1 class="text-4xl font-semibold text-glow">What can I help with?</h1>
            <p class="text-gray-400 text-sm">Ask Citrux anything below and get detailed, structured answers.</p>
        </div>
    </div>

    <!-- Input Area with Glow Border -->
    <div class="p-4 bg-[#1e1e1e] border-t border-neutral-800">
        <div class="max-w-3xl mx-auto flex items-center bg-[#282828] rounded-full px-4 py-2.5 border border-neutral-700 glow-effect transition">
            <input id="userInput" type="text" placeholder="Message Citrux..." class="w-full bg-transparent text-gray-100 placeholder-gray-500 focus:outline-none text-sm px-2">
            <button id="sendBtn" class="bg-gradient-to-r from-yellow-400 to-orange-500 text-black rounded-full w-9 h-9 flex items-center justify-center font-bold flex-shrink-0 cursor-pointer shadow-lg hover:opacity-90 transition">↑</button>
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6IgVaLQHhbYAlWPSt4E0t7IThrbzRfkzWSxH5IaMtAerQ";

        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatContainer = document.getElementById('chatContainer');
        const welcomeText = document.getElementById('welcomeText');

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const rawText = userInput.value.trim();
            if (!rawText) return;

            if (welcomeText) welcomeText.remove();

            // Append User Message
            chatContainer.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-neutral-800 text-gray-100 rounded-2xl px-4 py-2.5 max-w-xl text-sm border border-neutral-700 shadow">
                        ${escapeHTML(rawText)}
                    </div>
                </div>
            `;
            
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Append Thinking Indicator
            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex gap-3 items-start my-3">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-yellow-400 to-orange-500 flex items-center justify-center font-bold text-black text-xs mt-1 shadow-md flex-shrink-0">🍋</div>
                    <div class="text-gray-400 text-sm leading-relaxed pt-2 saving">
                        Citrux is thinking<span>.</span><span>.</span><span>.</span>
                    </div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const structuredPrompt = `Please answer the following question clearly, using a point-by-point breakdown or bullet points where appropriate to make it very easy to understand: ${rawText}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: structuredPrompt }] }]
                    })
                });

                const data = await response.json();
                
                // Remove loading indicator
                document.getElementById(loadingId).remove();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                let aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response text found.";
                aiReply = formatMarkdownToHTML(aiReply);

                // Append AI Response
                chatContainer.innerHTML += `
                    <div class="flex gap-3 items-start my-3">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-yellow-400 to-orange-500 flex items-center justify-center font-bold text-black text-xs mt-1 shadow-md flex-shrink-0">🍋</div>
                        <div class="text-gray-200 text-sm leading-relaxed pt-1 ai-content w-full overflow-x-auto">
                            ${aiReply}
                        </div>
                    </div>
                `;
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (error) {
                document.getElementById(loadingId)?.remove();
                console.error("API Error:", error);
                chatContainer.innerHTML += `
                    <div class="text-red-400 text-sm p-3 bg-red-950/40 rounded-xl border border-red-800">
                        Error: ${escapeHTML(error.message)}
                    </div>
                `;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function formatMarkdownToHTML(text) {
            let safeText = escapeHTML(text);
            safeText = safeText.replace(/\*\*(.*?)\*\*/g, '<strong class="text-yellow-400 font-semibold">$1</strong>');
            
            let lines = safeText.split('\n');
            let formattedLines = lines.map(line => {
                let trimmed = line.trim();
                if (trimmed.startsWith('* ') || trimmed.startsWith('- ')) {
                    return `<li class="ml-4 mb-1">${trimmed.substring(2)}</li>`;
                }
                return line;
            });

            return formattedLines.join('<br>');
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag));
        }
    </script>
</body>
</html>
